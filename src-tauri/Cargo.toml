[package]
name = "napkin"
version = "0.1.0"
description = "A paper-napkin skin for Claude Code"
authors = ["Erscheinung"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "napkin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# strip=true would also strip proc-macro dylibs on macOS ("can't find crate for …_macros")
[profile.release.build-override]
strip = false
debug = false
