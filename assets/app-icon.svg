<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.32  0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="g"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g"/></feMerge>
    </filter>
    <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#c9562e" stroke-width="7" stroke-linecap="round"/>
    </pattern>
  </defs>
  <!-- napkin -->
  <path d="M104 132 L906 110 L924 896 L118 918 Z" fill="#f6f1e6" filter="url(#paper)" stroke="#d8cfbf" stroke-width="6"/>
  <path d="M150 176 L862 158 L878 852 L162 870 Z" fill="none" stroke="#e0d6c4" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round"/>
  <!-- critter -->
  <g transform="translate(512 530)" stroke="#2b2926" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-250 -130 C-252 -168 -222 -186 -180 -184 L180 -188 C224 -190 248 -164 246 -126 L250 96 C252 132 226 150 190 150 L-196 154 C-236 156 -254 130 -252 96 Z" fill="#e98a5f"/>
    <path d="M-236 -150 L232 -160 L236 100 L-234 110 Z" fill="url(#hatch)" stroke="none" opacity="0.55"/>
    <path d="M-150 150 L-152 236 M-86 152 L-84 238 M86 150 L88 236 M150 148 L148 234" fill="none" stroke-width="30"/>
    <path d="M-252 -10 C-300 -8 -318 30 -300 60 C-290 76 -266 76 -254 62" fill="#e98a5f"/>
    <circle cx="-110" cy="-58" r="20" fill="#2b2926" stroke="none"/>
    <circle cx="96" cy="-62" r="20" fill="#2b2926" stroke="none"/>
    <path d="M246 -130 C300 -190 318 -250 300 -300" fill="none"/>
    <path d="M320 -290 C346 -270 356 -246 350 -224 M348 -318 C382 -290 394 -256 384 -222" fill="none" stroke-width="10" opacity="0.7"/>
  </g>
</svg>
